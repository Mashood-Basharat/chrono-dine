version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronodine_postgres
    restart: always
    environment:
      POSTGRES_USER: chronodine_admin
      POSTGRES_PASSWORD: chronodine_secure_password
      POSTGRES_DB: chronodine_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronodine_admin -d chronodine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronodine_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://chronodine_admin:chronodine_secure_password@postgres:5432/chronodine_db
      - STREAM_SOURCE=videos/Cctv Resturant.mp4
      - CONFIDENCE_THRESHOLD=0.25
      - POSE_CONFIDENCE_THRESHOLD=0.30
    volumes:
      - ./models:/app/models
      - ./videos:/app/videos

volumes:
  pgdata:
